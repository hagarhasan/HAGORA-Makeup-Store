<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="100%" stop-color="#fce4ec"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e91e63"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" fill="url(#bgGrad)" rx="24"/>
  
  <!-- Subtle circular accent -->
  <circle cx="150" cy="130" r="70" fill="#f8bbd0" opacity="0.4"/>
  
  <!-- Cosmetic / Perfume Bottle Icon -->
  <g transform="translate(110, 75)" fill="url(#primaryGrad)">
    <!-- Bottle Cap -->
    <rect x="28" y="0" width="24" height="18" rx="4"/>
    <rect x="34" y="18" width="12" height="10" rx="2" fill="#ad1457"/>
    <!-- Bottle Pump / Neck Collar -->
    <rect x="22" y="28" width="36" height="6" rx="3" fill="#880e4f"/>
    <!-- Bottle Body -->
    <rect x="10" y="36" width="60" height="85" rx="16"/>
    <!-- Bottle Inner Highlight / Glass Reflection -->
    <path d="M 22 46 Q 25 78 25 105" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Label -->
    <rect x="20" y="62" width="40" height="32" rx="6" fill="#ffffff" opacity="0.9"/>
    <circle cx="40" cy="74" r="5" fill="#c2185b"/>
    <line x1="28" y1="84" x2="52" y2="84" stroke="#c2185b" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Sparkles -->
  <path d="M 85 95 Q 90 90 95 85 Q 90 80 85 75 Q 80 80 75 85 Q 80 90 85 95 Z" fill="#ec407a" opacity="0.8"/>
  <path d="M 215 155 Q 218 152 222 148 Q 218 145 215 141 Q 212 145 208 148 Q 212 152 215 155 Z" fill="#ec407a" opacity="0.8"/>
  
  <!-- Text Label -->
  <text x="150" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#c2185b" text-anchor="middle" letter-spacing="2">
    HAGORA BEAUTY
  </text>
  <text x="150" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#880e4f" text-anchor="middle" opacity="0.7">
    Image Unavailable
  </text>
</svg>
